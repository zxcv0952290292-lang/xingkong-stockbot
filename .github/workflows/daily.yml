name: Daily Stock Push

on:
  # 排程改由 Cloudflare 定時 Worker（08:40 台灣）用 workflow_dispatch 觸發，準時不延遲
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run stock push
        env:
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          OWNER_UID: ${{ secrets.OWNER_UID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TZ: 'Asia/Taipei'
        run: python -u twstock_bot.py

      # 鏡像到 Cloudflare + 補供應鏈區塊。
      # 以前只能在 Stanley 的 Mac 上跑（wrangler 走本機 OAuth），Mac 蓋著就整天不部署。
      # 2026-07-12 拿到 CLOUDFLARE_API_TOKEN 後搬上雲，不再靠他開機。
      - name: Mirror to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TZ: 'Asia/Taipei'
        run: |
          python -u deploy_stock_cf.py
          npx -y wrangler@latest pages deploy cf_stock_site \
            --project-name ferryman-stock --branch main --commit-dirty=true
